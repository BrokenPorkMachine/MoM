name: MacOnMac
options:
  bundleIdPrefix: ca.zensoftware
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_ENTITLEMENTS: Resources/MacOnMac.entitlements
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: ""
targets:
  MacOnMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
        excludes:
          - PhysicalDiskAccess.swift
          - ReadOnlyGrantPolicy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.zensoftware.MacOnMac
        PRODUCT_NAME: MacOnMac
        INFOPLIST_KEY_CFBundleDisplayName: "MoM: MacOnMac"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    postBuildScripts:
      - name: Bundle signed launchd daemon
        script: |
          set -euo pipefail
          OUT="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "${OUT}/MacOS" "${OUT}/Library/LaunchDaemons"
          cp "${BUILT_PRODUCTS_DIR}/MacOnMacRawDiskDaemon" "${OUT}/MacOS/VolumeBootRawDiskDaemon"
          cp "${SRCROOT}/Resources/LaunchDaemons/ca.zensoftware.MacOnMac.RawDiskBroker.plist" "${OUT}/Library/LaunchDaemons/ca.zensoftware.MacOnMac.RawDiskBroker.plist"
    dependencies:
      - target: MacOnMacDiskBroker
        embed: true
      - target: MacOnMacRawDiskDaemon
  MacOnMacDiskBroker:
    type: xpc-service
    platform: macOS
    sources:
      - path: Helpers/VolumeBootDiskBroker/main.swift
      - path: Core/BrokerAuthorizationPolicy.swift
      - path: Core/BrokerProtocolContract.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.zensoftware.MacOnMac.DiskBroker
        PRODUCT_NAME: MacOnMacDiskBroker
        INFOPLIST_FILE: Helpers/VolumeBootDiskBroker/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ""

  MacOnMacRawDiskDaemon:
    type: tool
    platform: macOS
    sources:
      - path: Privileged/VolumeBootRawDiskDaemon/main.swift
      - path: Core/DaemonBrokerContract.swift
      - path: Core/BrokerAuthorizationPolicy.swift
      - path: Core/PhysicalDiskTopologyProof.swift
      - path: Privileged/VolumeBootRawDiskDaemon/PhysicalDiskTopologyProbe.swift
    settings:
      base:
        PRODUCT_NAME: MacOnMacRawDiskDaemon
        PRODUCT_BUNDLE_IDENTIFIER: ca.zensoftware.MacOnMac.RawDiskBroker
        OTHER_CODE_SIGN_FLAGS: "--identifier ca.zensoftware.MacOnMac.RawDiskBroker"
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: YES
